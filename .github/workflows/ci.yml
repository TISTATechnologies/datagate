name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DB_PASSWORD: CiStrongPass789

jobs:
  validate-workflows:
    # Treats Elsa workflow definitions as versioned artifacts: they must be
    # valid JSON and carry the fields we depend on before anything deploys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow definition JSON
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(workflow/definitions/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No workflow definitions found"; exit 1
          fi
          for f in "${files[@]}"; do
            echo "checking $f"
            jq -e 'has("definitionId") and has("name") and has("root")' "$f" > /dev/null
          done
          echo "All workflow definitions valid."

  build:
    # Builds the solution and runs the business-rule unit tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: ./tools/bootstrap.sh
      - name: Unit tests (business rules - no Docker needed)
        run: dotnet test test/DataGate.Domain.Tests --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/

  security:
    # Repo filesystem scan + NuGet advisory list (artifact always uploaded).
    # Trivy exit-code 0 so the demo stays green while still producing a report;
    # tighten to exit-code 1 when the backlog is clean.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: sarif
          output: trivy-fs.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-trivy
          path: trivy-fs.sarif
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: NuGet vulnerable packages (informational)
        run: |
          set -euo pipefail
          dotnet restore
          dotnet list package --vulnerable --include-transitive | tee nuget-vulnerable.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-nuget
          path: nuget-vulnerable.txt

  gate-smoke:
    # Full stack: API gate path (clean → gold, dirty → pending).
    needs: [validate-workflows, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          # override password for CI
          sed -i.bak "s/^DB_PASSWORD=.*/DB_PASSWORD=${DB_PASSWORD}/" .env || \
            echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
      - name: Start stack
        run: docker compose --env-file .env -f deploy/docker-compose.yml up -d --build
      - name: Gate smoke (API simulate clean/dirty)
        run: |
          chmod +x tools/gate-smoke.sh
          ./tools/gate-smoke.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f deploy/docker-compose.yml down -v

  sdlc-pack:
    # Bundles architecture / status / cicd docs + unit test results for auditors.
    needs: [build, security]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-results
          path: TestResults
        continue-on-error: true
      - name: Build SDLC pack
        run: |
          set -euo pipefail
          mkdir -p sdlc-pack/docs sdlc-pack/tests
          cp docs/architecture.md docs/status.md docs/cicd-automation.md sdlc-pack/docs/
          cp -R TestResults/* sdlc-pack/tests/ 2>/dev/null || true
          printf '%s\n' \
            '# DataGate SDLC pack' \
            "Generated by GitHub Actions on ${GITHUB_SHA}" \
            'Contents: architecture, status, cicd-automation, unit test TRX (if present).' \
            > sdlc-pack/README.md
          tar -czf sdlc-pack.tgz sdlc-pack
      - uses: actions/upload-artifact@v4
        with:
          name: sdlc-pack
          path: sdlc-pack.tgz
