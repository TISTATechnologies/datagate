# Harness CD pipeline — deploy DataGate on a Delegate (not Harness Cloud).
# Import as a second pipeline (datagate-cd) or merge the Deploy stage into datagate-ci.
#
# Prerequisites: docs/harness-cd.md
#   - Delegate Connected with Docker Compose
#   - Set delegateSelectors to your Delegate name/tag
#   - connector datagate_github with API access
#
# Git Experience path if remote: .harness/cd-pipeline.yaml

pipeline:
  name: datagate-cd
  identifier: datagatecd
  projectIdentifier: datagate
  orgIdentifier: default
  tags:
    product: datagate
    kind: cd
  properties:
    ci:
      codebase:
        connectorRef: datagate_github
        repoName: datagate
        build: <+input>
  stages:
    # Keep a fast check before deploy so CD never ships a broken main.
    - stage:
        name: Precheck
        identifier: precheck
        description: Validate workflows before deploy
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: validate
                  identifier: validate
                  spec:
                    shell: Sh
                    command: |
                      chmod +x tools/*.sh
                      ./tools/ci-local.sh validate

    # REPLACE runtime with Delegate infrastructure in the UI if Cloud rejects Docker.
    # Harness Cloud cannot keep compose up — use Project Setup → Delegates.
    - stage:
        name: Deploy demo
        identifier: deploy_demo
        description: compose up --build, seed Elsa, gate-smoke (lasting stack on Delegate)
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: deploy
                  identifier: deploy
                  spec:
                    shell: Sh
                    command: |
                      set -e
                      echo "If this stage runs on Harness Cloud, move it to a Delegate (docs/harness-cd.md)."
                      chmod +x tools/*.sh
                      cp -n .env.example .env 2>/dev/null || true
                      export RUN_SMOKE=1
                      export SEED=1
                      ./tools/deploy-local.sh
