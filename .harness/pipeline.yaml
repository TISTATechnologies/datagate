# Harness CI pipeline for DataGate (Harness Cloud — first run).
# Git Experience YAML path (relative to repo root): .harness/pipeline.yaml
# Do NOT paste a github.com/.../blob/... URL into "YAML Path".
#
# Prerequisites:
#   1. Connector datagate_github with API access enabled (same PAT secret).
#   2. Connect through Harness Platform (required for Harness Cloud).
# Smoke/deploy need Docker on a Delegate — omitted here on purpose.

pipeline:
  name: datagate-ci
  identifier: datagateci
  projectIdentifier: datagate
  orgIdentifier: default
  tags:
    product: datagate
  properties:
    ci:
      codebase:
        connectorRef: datagate_github
        repoName: datagate
        build: <+input>
  stages:
    - stage:
        name: Validate and unit
        identifier: validate_and_unit
        description: Workflow JSON + domain unit tests (no Docker)
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: chmod tools
                  identifier: chmod_tools
                  spec:
                    shell: Sh
                    command: chmod +x tools/*.sh
              - step:
                  type: Run
                  name: validate workflows
                  identifier: validate
                  spec:
                    shell: Sh
                    command: ./tools/ci-local.sh validate
              - step:
                  type: Run
                  name: unit tests
                  identifier: unit
                  spec:
                    shell: Sh
                    command: ./tools/ci-local.sh unit
